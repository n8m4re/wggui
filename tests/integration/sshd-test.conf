# Test containers only. Complete sshd_config(5), loaded with `sshd -f` so all distros use the same
# configuration regardless of whether their sshd_config supports an include directory.
Port 22
HostKey /etc/ssh/ssh_host_ed25519_key
PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
# Key file is mounted from the host (not owned by root), so disable StrictModes
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
StrictModes no
